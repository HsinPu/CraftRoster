name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  node-runtime:
    name: Node ${{ matrix.node-version }} runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Validate Skill workflow contracts
        run: npm run validate:skill-contracts

      - name: Validate generated Skill catalog
        run: npm run validate:skill-catalog

      - name: Test Skill catalog generation
        run: npm run test:skill-catalog

      - name: Test install category index generation
        run: npm run test:install-categories

      - name: Validate Skill evals
        run: npm run validate:skill-evals

      - name: Test Skill eval validation
        run: npm run test:skill-evals

      - name: Test Skill routing evaluation
        run: npm run test:skill-routing

      - name: Test release baseline generation
        run: npm run test:release-baseline

      - name: Test Skill dependency metadata and links
        run: npm run test:skill-dependencies

      - name: Validate Skill review registry
        run: npm run validate:skill-review

      - name: Test Skill review registry guards
        run: npm run test:skill-review

      - name: Test offline Skill pilot packaging
        run: npm run test:skill-pilot-preparation

      - name: Test prospective holdout registration with synthetic data
        run: npm run test:skill-holdout

      - name: Test Skill pilot fixtures and local tool stubs
        run: npm run test:skill-pilot-fixtures

      - name: Test delivery fixture evidence and revisions
        run: npm run test:skill-delivery-fixtures

      - name: Test read-only deployment evidence fixtures
        run: npm run test:skill-deployment-fixtures

      - name: Test read-only App Store evidence fixtures
        run: npm run test:skill-app-store-fixtures

      - name: Test Python configuration task fixtures
        run: npm run test:skill-python-config-fixtures

      - name: Test MCP task material and documentation replay
        run: npm run test:skill-mcp-fixtures

      - name: Test virtual evaluation tool boundaries and artifact grading
        run: npm run test:skill-eval-broker

      - name: Test bounded task driver protocol and cancellation
        run: npm run test:skill-task-driver

      - name: Test Codex transport with offline JSONL fixtures
        run: npm run test:skill-codex-transport

      - name: Test Responses transport with offline provider fixtures
        run: npm run test:skill-responses-transport

      - name: Test frozen PR fixtures and read-only review service
        run: npm run test:skill-review-pr-fixtures

      - name: Test local Git review fixtures
        run: npm run test:skill-review-local-fixtures

      - name: Test approved planning input consistency
        run: npm run test:skill-spec-fixtures

      - name: Test unrelated footer fixture boundaries
        run: npm run test:skill-footer-fixtures

      - name: Test payment retry review fixture evidence
        run: npm run test:skill-review-payment-fixtures

      - name: Test authentication review evidence and negative controls
        run: npm run test:skill-review-auth-fixtures

      - name: Test selective Git history and compatibility evidence
        run: npm run test:skill-review-history-fixtures

      - name: Test mixed-version SQLite migration review evidence
        run: npm run test:skill-review-migration-fixtures

      - name: Test incoming review comments and bounded remediation
        run: npm run test:skill-review-comments-fixtures

      - name: Test generated dependency artifact review evidence
        run: npm run test:skill-review-generated-fixtures

      - name: Test cross-platform review evidence scope
        run: npm run test:skill-review-platform-fixtures

      - name: Test React checkout review fixture behavior
        run: npm run test:skill-review-react-fixtures

      - name: Test multi-service migration delivery fixture evidence
        run: npm run test:skill-delivery-migration-fixtures

      - name: Test pinned Three.js provenance input boundaries
        run: npm run test:skill-three-provenance-fixtures

      - name: Test GLB viewer lifecycle author inputs
        run: npm run test:skill-three-viewer-fixtures

      - name: Test R3F migration author inputs
        run: npm run test:skill-three-r3f-fixtures

      - name: Test renderer feature baseline author inputs
        run: npm run test:skill-three-renderer-fixtures

      - name: Test legacy furniture configurator author inputs
        run: npm run test:skill-three-configurator-fixtures

      - name: Test bounded Skill regression planning
        run: npm run test:skill-regressions

      - name: Test Skill originality audit
        run: npm run test:skill-originality

      - name: Test Skill source revision validation
        run: npm run test:skill-sources

      - name: Test Skill workflow contract validation
        run: npm run test:skill-contracts

      - name: Test CLI argument validation
        run: npm run test:cli

      - name: Test catalog validation guards
        run: npm run test:catalog

      - name: Test npm package inventory
        run: npm run test:package

  legacy-skill-history:
    name: Legacy Skill digest history
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify legacy Skill digest manifest against Git history
        run: node scripts/generate-legacy-skill-digests.js --check

  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate catalog
        run: npm run validate

      - name: Smoke test CLI
        run: |
          node craftroster-cli.js --help
          node craftroster-cli.js list
          node craftroster-cli.js search python
          node craftroster-cli.js info python-development

      - name: Test CLI argument validation
        run: npm run test:cli

      - name: Test catalog validation guards
        run: npm run test:catalog

      - name: Test Skill catalog generation
        run: npm run test:skill-catalog

      - name: Test install category index generation
        run: npm run test:install-categories

      - name: Test Skill eval validation
        run: npm run test:skill-evals

      - name: Test Skill routing evaluation
        run: npm run test:skill-routing

      - name: Test Skill originality audit
        run: npm run test:skill-originality

      - name: Test Skill source revision validation
        run: npm run test:skill-sources

      - name: Test Skill workflow contract validation
        run: npm run test:skill-contracts

  remote-integrity:
    name: Pinned source integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify pinned Agent references
        run: |
          for attempt in 1 2 3; do
            npm run verify:agent-references:remote && exit 0
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify pinned Skill source trees
        run: |
          for attempt in 1 2 3; do
            npm run verify:skill-sources:remote && exit 0
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit Agent originality
        run: |
          for attempt in 1 2 3; do
            npm run audit:agent-originality && exit 0
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Audit Skill originality
        run: |
          for attempt in 1 2 3; do
            npm run audit:skill-originality && exit 0
            test "$attempt" = 3 && exit 1
            sleep $((attempt * 10))
          done

  installer-powershell:
    name: Installer smoke (${{ matrix.powershell }})
    runs-on: windows-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native 5.1 exceeded 15 minutes while cases were still progressing.
          - powershell: powershell.exe
            timeout_minutes: 60
          - powershell: pwsh.exe
            timeout_minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show Windows runner diagnostics
        shell: powershell
        run: |
          Write-Host "PSVersion=$($PSVersionTable.PSVersion)"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"

      - name: Test Windows Codex executor with fake processes
        if: matrix.powershell == 'powershell.exe'
        run: npm run test:skill-codex-executor

      - name: Test prospective holdout registration on Windows
        if: matrix.powershell == 'powershell.exe'
        run: npm run test:skill-holdout

      - name: Run isolated PowerShell installer smoke test
        shell: powershell
        run: |
          $env:PSModuleAnalysisCachePath = 'NUL'
          & '${{ matrix.powershell }}' -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-install.ps1 -PowerShellExecutable '${{ matrix.powershell }}'

  installer-bash:
    name: Installer smoke (Bash)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run isolated Bash installer smoke test
        run: npm run smoke:install:bash

  installer-bash-macos:
    name: Installer smoke (Bash, macOS quick)
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Report Bash runtime
        run: bash --version | head -n 1

      - name: Verify smoke failure propagation
        run: |
          set -euo pipefail
          if output="$(CRAFTROSTER_SMOKE_TEST_FAIL_AFTER_SETUP=enabled bash scripts/smoke-install.sh --quick 2>&1)"; then
            printf '%s\n' "$output"
            echo "Smoke failure injection unexpectedly returned success." >&2
            exit 1
          fi
          printf '%s\n' "$output"
          [[ "$output" == *"FAIL injected smoke failure after setup"* ]]

      - name: Run isolated Bash installer smoke test
        run: npm run smoke:install:bash:quick

      - name: Run remote macOS Codex global install
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          test_home="$(mktemp -d "$RUNNER_TEMP/craftroster-macos-global.XXXXXXXX")"
          cleanup_remote_install() {
            case "$test_home" in
              "$RUNNER_TEMP"/craftroster-macos-global.*) rm -rf -- "$test_home" ;;
              *) printf 'Refusing to clean unexpected remote install root: %s\n' "$test_home" >&2; return 1 ;;
            esac
          }
          trap cleanup_remote_install EXIT
          export HOME="$test_home"
          export CODEX_HOME="$HOME/.codex"

          curl -fsSL https://raw.githubusercontent.com/HsinPu/CraftRoster/main/scripts/install.sh |
            bash -s -- --target codex --type skill
          curl -fsSL https://raw.githubusercontent.com/HsinPu/CraftRoster/main/scripts/install.sh |
            bash -s -- --target codex --type agent --enable-auto-delegation

          expected_skills="$(node -e "console.log(require('./skills.json').skills.length)")"
          expected_agents="$(node -e "console.log(require('./agents.json').agents.length)")"
          actual_skills="$(find "$CODEX_HOME/skills" -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d '[:space:]')"
          actual_agents="$(find "$CODEX_HOME/agents" -mindepth 1 -maxdepth 1 -type f -name '*.toml' | wc -l | tr -d '[:space:]')"

          [[ "$actual_skills" == "$expected_skills" ]]
          [[ "$actual_agents" == "$expected_agents" ]]
          grep -Fq '# CRAFTROSTER_AUTO_DELEGATION_START' "$CODEX_HOME/config.toml"
          printf 'Verified remote macOS global install: %s Skills, %s Agents, auto-delegation enabled.\n' \
            "$actual_skills" "$actual_agents"
